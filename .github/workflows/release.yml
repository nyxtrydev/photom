name: Release
# Pushing a tag like v0.2.0 builds signed installers for every platform and publishes a GitHub release
# that also carries the signed `latest.json` the in-app (opt-in) updater reads.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, args: '' }
          - {
              name: windows-offline,
              os: windows-latest,
              args: '--config src-tauri/tauri.offline-webview.conf.json',
            }
          - { name: macos-arm64, os: macos-latest, args: '--target aarch64-apple-darwin' }
          - {
              name: macos-x64,
              os: macos-13,
              args: '--target x86_64-apple-darwin --config src-tauri/tauri.macos-x64.conf.json',
            }
          - { name: linux, os: ubuntu-22.04, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-arm64' && 'aarch64-apple-darwin' || (matrix.name == 'macos-x64' && 'x86_64-apple-darwin' || '') }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xvfb

      # Intel macOS has no prebuilt ONNX Runtime crate binaries: bundle the official runtime library.
      - name: ONNX Runtime for Intel macOS
        if: matrix.name == 'macos-x64'
        run: |
          mkdir -p src-tauri/vendor && cd src-tauri/vendor
          curl -sSL https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-osx-x86_64-1.22.0.tgz | tar xz

      - run: pip install onnx numpy
      - run: npm ci
      - name: Fetch the model and build the compact fp16 file
        run: npm run model:fetch
      - name: Ship only the fp16 model
        shell: bash
        run: rm -f src-tauri/resources/models/isnet-general-use.onnx
      - name: Third-party licences
        run: npm run licenses
      - name: Release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/changelog.mjs "$VERSION"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update signing (required): see docs/RELEASING.md
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarisation (optional but required for Gatekeeper)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Photom ${{ github.ref_name }}'
          releaseBodyPath: RELEASE_NOTES.md
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ matrix.name != 'windows-offline' }}
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

  # After the builds: prove the packaged apps start and process an image.
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install and smoke-test the packaged app (downloads this release's installers)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist
          ls dist
          case "$RUNNER_OS" in
            Windows)
              installer=$(ls dist/*setup.exe | grep -v offline | head -1)
              "$installer" /S /D='C:\Photom'
              'C:\Photom\Photom.exe' --smoke-test --smoke-out smoke.txt ;;
            macOS)
              hdiutil attach dist/*aarch64.dmg -mountpoint /Volumes/Photom
              /Volumes/Photom/Photom.app/Contents/MacOS/photom --smoke-test --smoke-out smoke.txt ;;
            Linux)
              chmod +x dist/*.AppImage
              sudo apt-get update && sudo apt-get install -y xvfb libwebkit2gtk-4.1-0 libfuse2
              xvfb-run -a dist/*.AppImage --appimage-extract-and-run --smoke-test --smoke-out smoke.txt ;;
          esac
          cat smoke.txt
